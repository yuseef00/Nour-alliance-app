<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f6b4f" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <title>الصفحة غير موجودة (404) — نور | رفيق القرآن الكريم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        background-color: #f7f3ea;
        color: #17211d;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 560px;
        width: 100%;
        background: rgba(253, 250, 243, 0.94);
        border: 1px solid rgba(15, 107, 79, 0.18);
        border-radius: 28px;
        padding: 36px 28px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(15, 107, 79, 0.08);
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 9999px;
        border: 2px solid rgba(201, 164, 76, 0.7);
        padding: 6px;
        background: #fdfaf3;
        object-fit: contain;
        margin: 0 auto 16px;
        display: block;
      }
      .code {
        font-size: 56px;
        font-weight: 700;
        color: #0f6b4f;
        margin: 0;
        line-height: 1.1;
      }
      h1 {
        font-size: 24px;
        margin: 12px 0 8px;
      }
      p {
        font-size: 14px;
        color: #5c6862;
        line-height: 1.8;
        margin: 0 0 24px;
      }
      .primary {
        display: inline-block;
        background: #0f6b4f;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 26px;
        border-radius: 9999px;
      }
      .links {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid rgba(15, 107, 79, 0.12);
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .links a {
        color: #0f6b4f;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 9999px;
        border: 1px solid rgba(15, 107, 79, 0.22);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/pwa-192x192.png" alt="شعار نور للقرآن الكريم" class="logo" />
      <p class="code">404</p>
      <h1>الصفحة غير موجودة</h1>
      <p>
        عذرًا، الرابط الذي طلبته غير متوفر في تطبيق نور للقرآن الكريم. يمكنك العودة إلى الصفحة الرئيسية أو تصفح الأقسام العامة أدناه.
      </p>
      <a href="/" class="primary">العودة إلى الصفحة الرئيسية</a>
      <nav class="links" aria-label="الأقسام العامة">
        <a href="/quran">القرآن الكريم</a>
        <a href="/tafsir">التفسير</a>
        <a href="/recitations">التلاوات</a>
        <a href="/adhkar">الأذكار</a>
        <a href="/prayer-times">مواقيت الصلاة</a>
      </nav>
    </main>
  </body>
</html>
