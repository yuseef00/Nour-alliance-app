name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Download App Logo
        run: |
          mkdir -p assets
          curl -fL "https://ibb.co" -o assets/logo.png

      - name: Install dependencies and build web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Android platform and Icons
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx --yes @capacitor/assets generate --android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nour-Alliance-APK
          path: android/app/build/outputs/apk/debug/*.apk
