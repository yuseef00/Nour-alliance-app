name: Build Nour Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web bundle
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Prepare Android platform and Athan resources
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable android/app/src/main/res/values
          if [ -f "public/audio/azan_makkah.mp3" ] && [ ! -f "android/app/src/main/res/raw/azan_makkah.mp3" ]; then
            cp public/audio/azan_makkah.mp3 android/app/src/main/res/raw/azan_makkah.mp3
          fi
          if [ -f "public/audio/azan_madinah.mp3" ] && [ ! -f "android/app/src/main/res/raw/azan_madinah.mp3" ]; then
            cp public/audio/azan_madinah.mp3 android/app/src/main/res/raw/azan_madinah.mp3
          fi
          if [ -f "public/pwa-192x192.png" ] && [ ! -f "android/app/src/main/res/drawable/ic_stat_nour.png" ]; then
            cp public/pwa-192x192.png android/app/src/main/res/drawable/ic_stat_nour.png
          fi
          if [ -f "android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml" ] && [ -f "src/assets/images/nour_logo.png" ]; then
            rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_background.xml
            rmdir android/app/src/main/res/drawable-v24 2>/dev/null || true
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FDFAF3</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
            if ! command -v convert >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            fi
            SRC="src/assets/images/nour_logo.png"
            BG="#FDFAF3"
            for spec in "mdpi:108" "hdpi:162" "xhdpi:216" "xxhdpi:324" "xxxhdpi:432"; do
              dir="${spec%%:*}"; size="${spec##*:}"; logo_size=$((size * 58 / 100))
              convert "$SRC" -resize "${logo_size}x${logo_size}" -background none -gravity center -extent "${size}x${size}" "android/app/src/main/res/mipmap-${dir}/ic_launcher_foreground.png"
            done
            for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              dir="${spec%%:*}"; size="${spec##*:}"
              sq_logo=$((size * 86 / 100)); rnd_logo=$((size * 72 / 100)); radius=$((size * 20 / 100))
              half=$(awk "BEGIN {printf \"%.2f\", ($size - 1) / 2.0}")
              convert -size "${size}x${size}" xc:none -fill "$BG" -draw "roundrectangle 0,0,$((size-1)),$((size-1)),${radius},${radius}" \( "$SRC" -resize "${sq_logo}x${sq_logo}" \) -gravity center -composite "android/app/src/main/res/mipmap-${dir}/ic_launcher.png"
              convert -size "${size}x${size}" xc:none -fill "$BG" -draw "circle ${half},${half} ${half},0" \( "$SRC" -resize "${rnd_logo}x${rnd_logo}" \) -gravity center -composite "android/app/src/main/res/mipmap-${dir}/ic_launcher_round.png"
            done
            for spec in "drawable:480:320" "drawable-port-mdpi:320:480" "drawable-port-hdpi:480:800" "drawable-port-xhdpi:720:1280" "drawable-port-xxhdpi:960:1600" "drawable-port-xxxhdpi:1280:1920" "drawable-land-mdpi:480:320" "drawable-land-hdpi:800:480" "drawable-land-xhdpi:1280:720" "drawable-land-xxhdpi:1600:960" "drawable-land-xxxhdpi:1920:1280"; do
              IFS=":" read -r dir w h <<< "$spec"
              min_dim=$(( w < h ? w : h )); logo_size=$(( min_dim * 48 / 100 ))
              convert -size "${w}x${h}" "xc:${BG}" \( "$SRC" -resize "${logo_size}x${logo_size}" \) -gravity center -composite "android/app/src/main/res/${dir}/splash.png"
            done
          fi
          npx cap sync android

      - name: Configure Android Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_PATH="${{ runner.temp }}/nour-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            PASS="${KEYSTORE_PASSWORD}"
            ALIAS="${KEY_ALIAS:-nour}"
            KPASS="${KEY_PASSWORD:-$PASS}"
            SIGN_SOURCE="GitHub Secret Keystore"
          else
            PASS="nour-release-keystore-pass"
            ALIAS="nour"
            KPASS="$PASS"
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storetype PKCS12 \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$PASS" \
              -keypass "$KPASS" \
              -dname "CN=Nour Quran, O=Nour, L=Makkah, C=SA"
            SIGN_SOURCE="Auto-generated Signing Key (Add ANDROID_KEYSTORE_BASE64 secret for consistent store updates)"
          fi

          SHA256_CERT=$(keytool -list -v -keystore "$KS_PATH" -storepass "$PASS" -alias "$ALIAS" | grep -i "SHA256:" | head -n1 | sed 's/.*SHA256: *//')
          echo "NOUR_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "NOUR_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "NOUR_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "NOUR_KEY_PASSWORD=$KPASS" >> "$GITHUB_ENV"
          echo "NOUR_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
          echo "SIGN_SOURCE=$SIGN_SOURCE" >> "$GITHUB_ENV"
          echo "SHA256_CERT=$SHA256_CERT" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          RELEASE_DIR="app/build/outputs/apk/release"
          if [ ! -f "$RELEASE_DIR/app-release.apk" ] && [ -f "$RELEASE_DIR/app-release-unsigned.apk" ]; then
            BUILD_TOOLS=$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n1)
            "$BUILD_TOOLS/zipalign" -f -p 4 "$RELEASE_DIR/app-release-unsigned.apk" "$RELEASE_DIR/app-release-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$NOUR_KEYSTORE_PATH" \
              --ks-pass "pass:$NOUR_KEYSTORE_PASSWORD" \
              --ks-key-alias "$NOUR_KEY_ALIAS" \
              --key-pass "pass:$NOUR_KEY_PASSWORD" \
              --out "$RELEASE_DIR/app-release.apk" \
              "$RELEASE_DIR/app-release-aligned.apk"
            rm -f "$RELEASE_DIR/app-release-aligned.apk"
          fi

      - name: Write Build Summary
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          {
            echo "### تطبيق نور — حزمة أندرويد الرسمية (Signed Release APK)"
            echo "- **اسم الحزمة:** \`app.vercel.nouralqran.twa\`"
            echo "- **رقم الإصدار (versionCode):** \`${NOUR_VERSION_CODE}\`"
            echo "- **حجم الملف:** \`${APK_SIZE}\`"
            echo "- **مصدر التوقيع:** ${SIGN_SOURCE}"
            echo "- **بصمة الشهادة (SHA-256):** \`${SHA256_CERT}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nour-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
