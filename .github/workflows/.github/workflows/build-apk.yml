name: Build Nour Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install and build
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_PATH="${{ runner.temp }}/nour-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            PASS="${KEYSTORE_PASSWORD}"
            ALIAS="${KEY_ALIAS:-nour}"
            KPASS="${KEY_PASSWORD:-$PASS}"
          else
            PASS="nour-release-keystore-pass"
            ALIAS="nour"
            KPASS="$PASS"
            keytool -genkeypair -v -keystore "$KS_PATH" -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$KPASS" \
              -dname "CN=Nour Quran, O=Nour, L=Makkah, C=SA"
          fi
          echo "NOUR_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "NOUR_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "NOUR_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "NOUR_KEY_PASSWORD=$KPASS" >> "$GITHUB_ENV"
          echo "NOUR_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nour-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
